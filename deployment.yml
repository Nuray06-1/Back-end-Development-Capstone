apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
  labels:
    run: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: djangoserver
  template:
    metadata:
      labels:
        run: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: us.icr.io/sn-labs-moonlightlun/djangoserver:1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: SONGS_SERVICE_URL
              value: http://songs-sn-labs-moonlightlun.labs-prod-openshift-san-a45631dc5778dc6371c67d206ba9ae5c-0000.us-east.containers.appdomain.cloud
            - name: PICTURES_SERVICE_URL
              value: https://pictures.2h4of32d496w.us-south.codeengine.appdomain.cloud
            - name: DJANGO_ALLOWED_HOSTS
              value: localhost,127.0.0.1,.cognitiveclass.ai,.appdomain.cloud
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      restartPolicy: Always
